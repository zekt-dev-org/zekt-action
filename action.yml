name: 'Zekt Event Action'
description: 'Send workflow events to Zekt broker for distribution to consumers. No secrets required - uses GitHub OIDC for authentication.'
author: 'zekt-dev-org'

branding:
  icon: 'send'
  color: 'orange'

inputs:
  event-type:
    description: 'The type of event to send (e.g., deployment, release, build-complete). Required when orchestrate: false.'
    required: false
  payload:
    description: >
      Arbitrary JSON payload (orchestrate: false) OR orchestration plan object
      (orchestrate: true). See README for the required shape when orchestrate is true.
    required: false
    default: '{}'
  zekt-api-url:
    description: 'Zekt API URL (optional - defaults to production)'
    required: false
    default: 'https://fxdevzektapp.azurewebsites.net'
  shield:
    description: 'Enable end-to-end encryption of payload (requires consumers with Shield enabled)'
    required: false
    default: 'false'
  orchestration-api-url:
    description: 'Zekt API URL for orchestration endpoints (defaults to https://www.zekt.dev)'
    required: false
    default: 'https://www.zekt.dev'
  orchestrate:
    description: >
      When true, treat payload as a multi-step orchestration plan and POST to
      /api/orchestration/submit instead of the standard event endpoint.
      All orchestration-specific inputs (execution_mode, wait) are ignored when false.
    required: false
    default: 'false'
  execution_mode:
    description: >
      Execution strategy for the orchestration. Only evaluated when orchestrate: true.
      'sequential' runs each step after the previous completes.
    required: false
    default: 'sequential'
  wait:
    description: >
      When true (and orchestrate: true), the action blocks after submitting the
      orchestration, polling every 30 seconds until the execution reaches a terminal
      state (completed, failed, timed_out). Step outputs are then written to GITHUB_OUTPUT.
    required: false
    default: 'false'

outputs:
  event-id:
    description: 'The unique ID of the sent event'
  status:
    description: 'Status of the event submission (success/failed)'
  consumers-notified:
    description: 'Number of consumers that will receive this event'
  execution_id:
    description: 'Orchestration execution ID returned by the Zekt backend. Only set when orchestrate: true.'
  execution_status:
    description: 'Terminal status of the orchestration: completed | failed | timed_out. Only set when orchestrate: true AND wait: true.'

runs:
  using: 'node24'
  main: 'dist/index.js'

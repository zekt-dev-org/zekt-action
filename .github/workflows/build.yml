name: Validate Action

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Validate action.yml syntax
        run: |
          echo "Validating action.yml..."
          # Check if file exists and is valid YAML
          if ! python3 -c "import yaml; yaml.safe_load(open('action.yml'))"; then
            echo "Error: action.yml is not valid YAML"
            exit 1
          fi
          echo "✅ action.yml is valid YAML"
      
      - name: Check required fields
        run: |
          echo "Checking required fields..."
          
          # Check for required top-level fields
          if ! grep -q "^name:" action.yml; then
            echo "Error: Missing 'name' field"
            exit 1
          fi
          
          if ! grep -q "^runs:" action.yml; then
            echo "Error: Missing 'runs' field"
            exit 1
          fi
          
          # Check for valid action type (node24, node20, or composite)
          if grep -qE "using: 'node(20|24)'" action.yml; then
            echo "✅ Node.js action detected"
          elif grep -q "using: 'composite'" action.yml; then
            echo "✅ Composite action detected"
          else
            echo "Error: Expected node24, node20, or composite action"
            exit 1
          fi
          
          echo "✅ All required fields present"
      
      - name: Build TypeScript action
        if: contains(github.event.head_commit.message, 'node') || hashFiles('src/**/*.ts') != ''
        run: |
          echo "Building TypeScript action..."
          if [ -f "package.json" ]; then
            npm ci
            npm run build
            echo "✅ Action built successfully"
          fi
